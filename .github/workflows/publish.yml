name: Publish to npm
on:
  push:
    tags: ['v*']
  release:
    types: [published]
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm config set registry https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run build:ui
      - run: pnpm exec biome check .
      - run: pnpm test
      - name: Verify npm package includes UI bundle
        run: |
          npm pack --dry-run 2>&1 | grep -q 'ui/dist/index.html' || { echo "ERROR: ui/dist/index.html missing from npm tarball"; exit 1; }
      - name: Publish to npm
        run: |
          version=$(jq -r .version package.json)
          if [ "$(npm view "context-lens@${version}" version 2>/dev/null)" = "$version" ]; then
            echo "Skipping context-lens@${version} (already published)"
            exit 0
          fi
          npm publish --access public
